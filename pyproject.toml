[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meeting-translation"
version = "0.1.0"
description = "Local bilingual live meeting caption overlay"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "soundfile>=0.12",
  "PySide6>=6.7",
  "pynput>=1.7",
  "webrtcvad-wheels>=2.0.14",
  "qwen-asr>=0.0.6",
  "transformers>=4.51",
  "accelerate>=1.0",
  "bitsandbytes>=0.45",
  "tomli>=2; python_version < '3.11'",
]

[project.scripts]
meeting-translation = "meeting_translation.app:main"
meeting-translation-service = "meeting_translation.service:main"
meeting-translation-replay = "meeting_translation.replay:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_translation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
